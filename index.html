<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adivina el color</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>
    Adivina el color <br>
    <span id="colorDisplay">RGB</span> <br>
    Encuentra el color correcto
  </h1>

  <div id="stripe">
    <button id="reset">Nuevos Colores</button>
    <span id="message"></span>
    <button class="mode" data-mode="easy">Fácil</button>
    <button class="mode selected" data-mode="hard">Difícil</button>
  </div>

  <div id="container">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
